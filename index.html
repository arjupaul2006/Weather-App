<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>WEATHER REPORT</title>
</head>
<body>

    <div class="container">

        <div class="box">

            <div class="search">

                <input type="text" id="userInput" spellcheck="false" placeholder="Enter location......">
                <button id="searchButton" onclick="getWeatherDetails()"><img src="search icon.svg" ></button>
    
            </div>
    
            <div class="weather">
    
                <div class="weatherImage">
                    <img src="" id="middleImage">
                </div>
    
                <h1 class="temp">0°c</h1>
    
                <h2 class="location">Location</h2>
    
            </div>
    
            <div class="details">
    
                <div class="humidity" id="detailsChild">
    
                    <img src="humidity.png" >
    
                    <div class="humidity-details">
    
                        <h3 class="humidity-text">HUMIDITY</h3>
                        <p class="humidity-value">0</p>
    
                    </div>
    
                </div>
    
                <div class="wind" id="detailsChild">
    
                    <img src="wind.png" >
    
                    <div class="wind-details">
    
                        <h3 class="wind-text">WIND SPEED</h3>
                        <p class="wind-value">0</p>
                        
                    </div>
    
                </div>
    
            </div>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
